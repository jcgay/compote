# https://goreleaser.com
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

homebrew_casks:
  - repository:
      owner: jcgay
      name: homebrew-jcgay
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    # no `directory`: Homebrew only discovers casks in Casks/ (cask_dir is
    # hardcoded), unlike formulae which could live at the repo root.
    homepage: "https://github.com/jcgay/compote"
    description: "Git merge driver that smooths pom.xml version conflicts"
    # `hooks.post.install` would emit Homebrew's deprecated `postflight` stanza,
    # so declare the replacement `postflight_steps` ourselves. Its paths default
    # to `staged_path`, hence `chdir: "."` instead of an interpolated path (which
    # would need `{{ }}` escaping here anyway).
    custom_block: |
      postflight_steps do
        on_macos do
          # binary is unsigned: strip the Gatekeeper quarantine flag
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "compote"], chdir: "."
        end
      end
    caveats: |
      Configure the merge driver:
        git config --global merge.compote.name "Écrase les poms proprement"
        git config --global merge.compote.driver "compote %O %A %B"
      Then bind it to pom.xml, globally for all your repos:
        mkdir -p ~/.config/git
        echo 'pom.xml merge=compote' >> ~/.config/git/attributes
      or per repo, in a committed .gitattributes:
        pom.xml merge=compote

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
