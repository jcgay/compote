name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          # Pinned: mise.jdx.dev/VERSION advertises 2026.9.3 but the release assets 404.
          # Drop this `with:` block once upstream publishes them.
          version: 2026.9.6
      - run: go build -o compote .
      - run: go vet ./...
      - run: go test ./...
